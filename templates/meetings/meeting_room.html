{% extends 'base.html' %}
{% load i18n %}

{% block title %}Meeting Room - {{ meeting.title }}{% endblock %}
{% csrf_token %}
<div id="zmmtg-root"></div>
{% block extra_js %}
<script src="https://source.zoom.us/3.13.2/lib/vendor/react.min.js"></script>
  <script src="https://source.zoom.us/3.13.2/lib/vendor/react-dom.min.js"></script>
  <script src="https://source.zoom.us/3.13.2/lib/vendor/redux.min.js"></script>
  <script src="https://source.zoom.us/3.13.2/lib/vendor/redux-thunk.min.js"></script>
  <script src="https://source.zoom.us/3.13.2/lib/vendor/lodash.min.js"></script>
  <script src="https://source.zoom.us/zoom-meeting-3.13.2.min.js"></script>
<script>
// Get CSRF token from cookie
function getCookie(name) {
    let cookieValue = null;
    if (document.cookie && document.cookie !== '') {
        const cookies = document.cookie.split(';');
        for (let i = 0; i < cookies.length; i++) {
            const cookie = cookies[i].trim();
            if (cookie.substring(0, name.length + 1) === (name + '=')) {
                cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                break;
            }
        }
    }
    return cookieValue;
}

function initZoom() {
    ZoomMtg.init({
        leaveUrl: "{% url 'meetings:meeting_detail' meeting.id %}",
        success: () => {
            console.log('Zoom initialized');
            startOrJoinMeeting();
        },
        error: (error) => {
            console.error('Zoom init error:', error);
            alert('Failed to initialize Zoom: ' + error.message);
        }
    });
}

async function startOrJoinMeeting() {
    try {
        const csrftoken = getCookie('csrftoken');
        if (!csrftoken) {
            throw new Error('CSRF token not found');
        }

        const response = await fetch(`/meetings/{{ meeting.zoom_meeting_id }}/signature/`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': csrftoken
            },
            body: JSON.stringify({
                meetingNumber: '{{ meeting.zoom_meeting_id }}',
                role: {% if is_host %}1{% else %}0{% endif %}
            })
        });

        const data = await response.json();
        if (!response.ok) {
            throw new Error(data.error || 'Failed to get signature');
        }

        ZoomMtg.join({
            signature: data.signature,
            meetingNumber: '{{ meeting.zoom_meeting_id }}',
            userName: '{{ request.user.get_full_name|default:request.user.email }}',
            sdkKey: data.sdkKey,
            userEmail: '{{ request.user.email }}',
            passWord: '{{ meeting.password }}',
            success: () => {
                console.log('Joined meeting successfully');
                document.getElementById('loadingOverlay').style.display = 'none';
            },
            error: (error) => {
                console.error('Join error:', error);
                alert('Failed to join meeting: ' + error.message);
            }
        });
    } catch (error) {
        console.error('Error joining meeting:', error);
        alert('An error occurred while joining the meeting: ' + error.message);
    }
}

document.addEventListener('DOMContentLoaded', function() {
    initZoom();
});
</script>
{% endblock %}
