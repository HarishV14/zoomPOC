{% block title %}Start Meeting{% endblock %}
{% block extra_css %}
<style>
    #zmmtg-root {
        width: 100vw;
        height: 100vh;
        position: fixed;
        top: 0;
        left: 0;
        z-index: 9999;
    }
</style>
{% endblock %}
{% block content %}
{% csrf_token %}
<div id="zmmtg-root"></div>
<script src="https://source.zoom.us/3.13.2/lib/vendor/react.min.js"></script>
<script src="https://source.zoom.us/3.13.2/lib/vendor/react-dom.min.js"></script>
<script src="https://source.zoom.us/3.13.2/lib/vendor/redux.min.js"></script>
<script src="https://source.zoom.us/3.13.2/lib/vendor/redux-thunk.min.js"></script>
<script src="https://source.zoom.us/3.13.2/lib/vendor/lodash.min.js"></script>
<script src="https://source.zoom.us/zoom-meeting-3.13.2.min.js"></script>
<script>
    const meetingNumber = "{{ meeting.meeting_id }}".replace(/\D/g, '');
    const passWord = "{{ meeting.password }}";
    const userName = "{{ user.get_full_name|default:user.email }}";
    const userEmail = "{{ user.email }}";
    const role = 1;
    const sdkKey = "{{ ZOOM_SDK_KEY }}";
    const signature = "{{ signature }}";
    const meetingId = "{{ meeting.id }}";
    let meetingEnded = false;
    
    const statusMap = {
        0: 'MEETING_STATUS_IDLE',
        1: 'MEETING_STATUS_CONNECTING',
        2: 'MEETING_STATUS_IN_MEETING',
        3: 'MEETING_STATUS_ENDED',
        4: 'MEETING_STATUS_FAILED',
        5: 'MEETING_STATUS_DISCONNECTING',
        6: 'MEETING_STATUS_RECONNECTING',
        7: 'MEETING_STATUS_WAITING_FOR_HOST'
    };
    
    function getCSRFToken() {
        const tokenElement = document.querySelector('[name=csrfmiddlewaretoken]');
        return tokenElement ? tokenElement.value : '';
    }

    function updateMeetingStatus(status) {
        const csrfToken = getCSRFToken();
        if (!csrfToken) {
            console.error('CSRF token not found');
            return;
        }
        
        if (typeof status === 'number' || !isNaN(parseInt(status))) {
            const numericStatus = parseInt(status);
            if (statusMap[numericStatus]) {
                status = statusMap[numericStatus];
            }
        }

        fetch(`/zoom/oauth/meetings/${meetingId}/client-status-update/`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/x-www-form-urlencoded',
                'X-CSRFToken': csrfToken
            },
            body: `status=${status}`
        })
        .then(response => response.json())
        .catch(error => console.error('Error updating meeting status:', error));
    }

    function handleMeetingEnd() {
        if (!meetingEnded) {
            meetingEnded = true;
            updateMeetingStatus('MEETING_STATUS_ENDED');
            setTimeout(() => {
                window.location.href = `${window.location.origin}/zoom/oauth/meetings/`;
            }, 1000);
        }
    }

    document.addEventListener('DOMContentLoaded', function() {
        ZoomMtg.init({
            leaveUrl: `${window.location.origin}/zoom/oauth/meetings/`,
            success: function() {
                ZoomMtg.inMeetingServiceListener('onMeetingStatus', function(data) {
                    if (typeof data.meetingStatus === 'number') {
                        updateMeetingStatus(data.meetingStatus);
                        if (data.meetingStatus === 3) { // MEETING_STATUS_ENDED
                            handleMeetingEnd();
                        }
                        else if (data.meetingStatus === 5) { // MEETING_STATUS_DISCONNECTING
                            setTimeout(() => {
                                if (!ZoomMtg.isInMeeting) {
                                    handleMeetingEnd();
                                }
                            }, 20000);
                        }
                    } else {
                        updateMeetingStatus(data.meetingStatus);
                        if (data.meetingStatus === 'MEETING_STATUS_ENDED') {
                            handleMeetingEnd();
                        }
                        else if (data.meetingStatus === 'MEETING_STATUS_DISCONNECTING') {
                            setTimeout(() => {
                                if (!ZoomMtg.isInMeeting) {
                                    handleMeetingEnd();
                                }
                            }, 7000);
                        }
                    }
                });

                // Listen for meeting state changes
                ZoomMtg.inMeetingServiceListener('onMeetingStateChange', function(data) {
                    if (data.state === 'in-meeting') {
                        updateMeetingStatus('MEETING_STATUS_IN_MEETING');
                    } 
                    else if (data.state === 'ended') {
                        handleMeetingEnd();
                    }
                });

                ZoomMtg.join({
                    meetingNumber: meetingNumber,
                    userName: userName,
                    signature: signature,
                    sdkKey: sdkKey,
                    userEmail: userEmail,
                    passWord: passWord,
                    success: function() {
                        updateMeetingStatus('MEETING_STATUS_IN_MEETING');
                    },
                    error: function(res) {
                        console.error('Error joining meeting:', res);
                        alert('Error joining meeting: ' + res.errorMessage);
                        window.location.href = `${window.location.origin}/zoom/oauth/meetings/`;
                    }
                });
            },
            error: function(res) {
                console.error('Error initializing Zoom SDK:', res);
                alert('Error initializing Zoom SDK: ' + res.errorMessage);
                window.location.href = `${window.location.origin}/zoom/oauth/meetings/`;
            }
        });
    });
</script>
{% endblock %}
